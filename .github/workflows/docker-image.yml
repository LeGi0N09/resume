name: Build resume PDF

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build resume PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build Docker image (uses repo Dockerfile)
        run: docker build -t latex .

      - name: Compile PDF and generate preview
        run: |
          set -e
          # run the container, compile the TeX file (run pdflatex twice to resolve refs)
          docker run --rm -i -v "${{ github.workspace }}":/data latex sh -c "\
            cd /data && \
            pdflatex -interaction=nonstopmode -halt-on-error Priyansh_Modi_Resume.tex || true && \
            pdflatex -interaction=nonstopmode -halt-on-error Priyansh_Modi_Resume.tex && \
            pdftoppm -r 150 -png -singlefile Priyansh_Modi_Resume.pdf preview \
          "

      - name: Upload compiled PDF and preview image
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifacts
          path: |
            Priyansh_Modi_Resume.pdf
            preview.png
